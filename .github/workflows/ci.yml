name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify quote renderer at responsive sizes
        run: npm run smoke:quote-ci

      - name: Upload quote screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quote-visual-smoke
          path: test-output/quote-ci-*.png
          if-no-files-found: ignore

name: Publish application update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: widget-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          "value=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Check whether this version is already published
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view "v${{ steps.version.outputs.value }}" --repo "${{ github.repository }}" --json isDraft 2> $null
          $ghExitCode = $LASTEXITCODE

          # gh returns 1 when the release does not exist.
          # Reset LASTEXITCODE so GitHub Actions does not treat that as step failure.
          $global:LASTEXITCODE = 0

          if ($ghExitCode -eq 0) {
            $draft = ($release | ConvertFrom-Json).isDraft
            if ($draft) {
              "published=false" >> $env:GITHUB_OUTPUT
            } else {
              "published=true" >> $env:GITHUB_OUTPUT
            }
          } else {
            "published=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install dependencies
        if: steps.existing.outputs.published != 'true'
        run: npm ci

      - name: Run tests
        if: steps.existing.outputs.published != 'true'
        run: npm test

      - name: Build Windows installer
        if: steps.existing.outputs.published != 'true'
        run: npm run dist

      - name: Publish verified GitHub release
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.cjs
